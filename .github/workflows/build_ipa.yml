name: Build iOS IPA for TrollStore

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Phiên bản hiển thị (Version Name)'
        required: false
        default: '1.0.0'
      build_number:
        description: 'Số hiệu bản dựng (Build Number)'
        required: false
        default: '1'

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Kiểm tra môi trường Flutter
        run: flutter doctor -v

      - name: 4. Cài đặt CocoaPods dependencies & Flutter Pub
        run: |
          cd app
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: 5. Build iOS Release (No Codesign)
        run: |
          cd app
          flutter build ios --release --no-codesign \
            --build-name=${{ github.event.inputs.build_name || '1.0.0' }} \
            --build-number=${{ github.event.inputs.build_number || '1' }}

      - name: 6. Đóng gói Payload thành file .ipa chuẩn TrollStore
        run: |
          cd app
          echo "Bắt đầu đóng gói file IPA..."
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 MusicPlayer_TrollStore.ipa Payload
          echo "Đóng gói hoàn tất! Kích thước file IPA:"
          ls -lh MusicPlayer_TrollStore.ipa

      - name: 7. Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer_TrollStore_v${{ github.event.inputs.build_name || '1.0.0' }}
          path: app/MusicPlayer_TrollStore.ipa
          retention-days: 14
