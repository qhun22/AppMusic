name: qhun22music
description: "qhun22Music - A personal music player for iOS TrollStore"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  just_audio_background: ^0.0.1-beta.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  ios: true
  image_path_ios: "assets/QHUN22.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/QHUN22.png
    - assets/qhun22-min.gif

