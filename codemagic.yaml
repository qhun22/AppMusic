workflows:
  ios-trollstore-release:
    name: Build qhun22Music IPA (TrollStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: 1. Khởi tạo sạch cấu trúc iOS chuẩn Flutter & Cài đặt thư viện
        script: |
          # 1. Tắt Swift Package Manager để dùng CocoaPods ổn định
          flutter config --no-enable-swift-package-manager

          # 2. Xóa cấu trúc iOS cũ và sinh mới từ Flutter SDK
          rm -rf ios
          flutter create --platforms=ios --org com.qhun22 .

          # 3. Cấu hình tên app qhun22Music và quyền chạy ngầm (Background Audio)
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName qhun22Music" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string qhun22Music" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName qhun22Music" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string qhun22Music" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist 2>/dev/null || true

          # 4. Tải dependencies và tạo App Icon từ assets/var.jpg
          flutter pub get
          dart run flutter_launcher_icons

          # 5. Cài đặt CocoaPods
          cd ios
          pod install --repo-update
          cd ..

      - name: 2. Biên dịch iOS Release Unsigned (Không cần tài khoản Apple Developer)
        script: |
          # Bật cấu hình không ký mã và đặt dummy team trong xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=0000000000" >> ios/Flutter/Release.xcconfig

          # Biên dịch iOS release unsigned (giữ nguyên cấu trúc CocoaPods)
          flutter build ios --release --no-codesign || xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 3. Đóng gói file .ipa chuẩn TrollStore
        script: |
          echo "Bắt đầu đóng gói Payload..."
          mkdir -p Payload

          RUNNER_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$RUNNER_PATH" ]; then
            echo "Lỗi: Không tìm thấy Runner.app trong thư mục build!"
            exit 1
          fi

          echo "Tìm thấy Runner.app tại: $RUNNER_PATH"
          cp -r "$RUNNER_PATH" Payload/
          zip -r -9 qhun22Music_TrollStore.ipa Payload
          echo "Đóng gói hoàn tất! Kích thước file IPA:"
          ls -lh qhun22Music_TrollStore.ipa

    artifacts:
      - app/qhun22Music_TrollStore.ipa
      - "*.ipa"
