workflows:
  ios-trollstore-release:
    name: Build qhun22Music IPA (TrollStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: 1. Tắt Swift Package Manager & Cài đặt Dependencies
        script: |
          # Tắt Swift Package Manager theo tài liệu chính thức Flutter
          flutter config --no-enable-swift-package-manager
          flutter pub get
          dart run flutter_launcher_icons
          cd ios
          pod install --repo-update
          cd ..

      - name: 2. Biên dịch Flutter iOS Release (No Codesign)
        script: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign

      - name: 3. Đóng gói file .ipa chuẩn TrollStore
        script: |
          echo "Bắt đầu đóng gói Payload..."
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 qhun22Music_TrollStore.ipa Payload
          ls -lh qhun22Music_TrollStore.ipa

    artifacts:
      - app/qhun22Music_TrollStore.ipa
      - "*.ipa"
